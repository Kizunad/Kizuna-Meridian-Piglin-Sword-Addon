description = '仅用于流金剑目录验证；不装入正式 Fabric 包。'

dependencies {
    api project(':shared')
    api 'dev.kizuna.meridian.technique:server'
    api 'dev.kizuna.meridian.human:server'
    api 'local.meridian:server'
    api 'dev.kizuna.meridian.vanilla:server'
    testImplementation libs.junit4
    testImplementation libs.gson
}

test {
    useJUnit()
    include '**/PiglinSwordCatalogTest.class'
    systemProperty 'piglinSword.fabricJar', project(':fabric').tasks.named('jar').get().archiveFile.get().asFile
    dependsOn ':fabric:jar'
}
